server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: stock-data-service
              uri: lb://STOCK-DATA-SERVICE
              predicates:
                - Path=/stocks/**

            - id: indicator-service
              uri: lb://INDICATOR-SERVICE
              predicates:
                - Path=/indicators/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
