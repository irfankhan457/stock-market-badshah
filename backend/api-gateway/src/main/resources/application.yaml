server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: stock-data-service
              uri: lb://STOCK-DATA-SERVICE
              predicates:
                - Path=/stocks/**

            - id: indicator-service
              uri: lb://INDICATOR-SERVICE
              predicates:
                - Path=/indicators/**

            - id: scanner-service
              uri: lb://SCANNER-SERVICE
              predicates:
                - Path=/scanner/**

            - id: fundamental-service
              uri: lb://FUNDAMENTAL-SERVICE
              predicates:
                - Path=/fundamentals/**

            - id: strategy-service
              uri: lb://STRATEGY-SERVICE
              predicates:
                - Path=/strategy/**

            - id: backtest-service
              uri: lb://BACKTEST-SERVICE
              predicates:
                - Path=/backtests/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**

            - id: discovery-server
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
