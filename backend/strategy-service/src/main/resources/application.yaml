server:
  port: 8085

spring:
  application:
    name: strategy-service

services:
  scanner-url: http://localhost:8083
  fundamental-url: http://localhost:8084
  backtest-url: http://localhost:8086
  stock-data-url: http://localhost:8081

strategy:
  # Analysis calls are I/O-bound. Keep them parallel but bounded to avoid flooding downstream services.
  scan-concurrency: ${STRATEGY_SCAN_CONCURRENCY:16}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
