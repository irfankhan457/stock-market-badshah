server:
  port: 8081

spring:
  application:
    name: stock-data-service

  datasource:
    url: "${STOCK_DB_URL:jdbc:postgresql://${STOCK_DB_HOST:localhost}:${STOCK_DB_PORT:5432}/${STOCK_DB_NAME:stock_market_badshah}}"
    username: "${STOCK_DB_USER:stock_app}"
    password: "${STOCK_DB_PASSWORD:stock_app_dev_only}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: "${STOCK_DB_SHOW_SQL:false}"

market-data:
  refresh-threads: "${MARKET_DATA_REFRESH_THREADS:16}"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
